<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!--
    Admin-only Content Security Policy (security audit finding H-2).

    default-src 'none'  - deny everything, then allow only what this page proves it needs.
    script-src  'self'  - the pinned, locally vendored supabase-js bundle and ./admin.js only.
                          No 'unsafe-inline' and no 'unsafe-eval': the vendored bundle was
                          checked and contains no eval() or new Function() call sites.
    connect-src         - the Supabase project origin only (Auth, REST and Storage calls).
    img-src 'self' data: - the MFA enrolment QR code is delivered as a data: URI by Supabase.
    style-src   'self'  - same-origin stylesheets only.
    base-uri    'none'  - blocks <base> tag injection redirecting relative script URLs.
    form-action 'none'  - the login form is handled entirely in JS via preventDefault();
                          nothing should ever be able to POST it to another origin.
    object-src  'none'  - no plugins.

    NOTE: frame-ancestors is intentionally omitted here because browsers ignore it when
    delivered via <meta>. Clickjacking protection must be added at the hosting layer as a
    real HTTP response header (frame-ancestors 'none' or X-Frame-Options: DENY).
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self';
    connect-src
    'self'
    http://127.0.0.1:54321
    http://localhost:54321
    ws://127.0.0.1:54321
    ws://localhost:54321
    https://hldacuppejztqzqaejsi.supabase.co;
    img-src 'self' data:;
    style-src 'self';
    base-uri 'none';
    form-action 'none';
    object-src 'none'
  ">

  <title>Admin CMS</title>
</head>

<body>

  <main class="admin-auth">

    <section id="loading-screen">
      <p>Checking session...</p>
    </section>

    <section id="login-screen" hidden>
      <h1>Admin Login</h1>

      <form id="login-form">
        <label>
          Email
          <input
            id="email"
            type="email"
            autocomplete="username"
            required
          >
        </label>

        <label>
          Password
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
          >
        </label>

        <p id="login-error"></p>

        <button type="submit">
          Sign In
        </button>
      </form>
    </section>

    <section id="mfa-enroll-screen" hidden>
      <h1>Set up two-factor authentication</h1>

      <p>
        Scan this QR code using your authenticator app.
      </p>

      <img
        id="mfa-qr"
        alt="MFA QR Code"
      >

      <p>
        Manual key:
        <code id="mfa-secret"></code>
      </p>

      <input
        id="mfa-enroll-code"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        placeholder="123456"
      >

      <p id="mfa-enroll-error"></p>

      <button id="mfa-enable-button">
        Enable MFA
      </button>
    </section>

    <section id="mfa-challenge-screen" hidden>
      <h1>Two-factor authentication</h1>

      <p>
        Enter the code from your authenticator app.
      </p>

      <input
        id="mfa-code"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        placeholder="123456"
      >

      <p id="mfa-error"></p>

      <button id="mfa-submit-button">
        Verify
      </button>
    </section>

    <section id="admin-screen" hidden>
      <h1>Admin CMS</h1>

      <p>
        Authentication successful.
      </p>

      <button id="logout-button">
        Logout
      </button>
    </section>

  </main>

  <!--
    supabase-js is pinned to an exact version and served from this origin.
    Previously this was a floating CDN reference (@supabase/supabase-js@2), which meant
    unreviewed third-party code could change under the admin login page at any time.
    To upgrade: npm install --save-exact @supabase/supabase-js@<version>, then copy
    node_modules/@supabase/supabase-js/dist/umd/supabase.js to admin/vendor/ under the
    new versioned filename and update the src below.
  -->
  <script src="./vendor/supabase-js-2.112.3.js"></script>
  <script type="module" src="./admin.js"></script>

</body>

</html>
